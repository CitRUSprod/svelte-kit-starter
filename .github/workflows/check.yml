name: Check

on: [push, workflow_dispatch]

env:
    PUBLIC_TITLE: SvelteKit Starter

jobs:
    check:
        runs-on: ubuntu-24.04
        steps:
            - name: Checkout
              uses: actions/checkout@v4
            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 12.14.0
            - name: Setup Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: 26.12.0
                  cache: pnpm
            - name: Install dependencies
              run: pnpm i
            - name: Build
              run: pnpm build
            - name: Validate
              run: pnpm validate
